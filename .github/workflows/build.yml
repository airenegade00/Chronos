name: Build Chronos APK

# Repo secretek (Settings → Secrets and variables → Actions):
#   KEYSTORE_PASSPHRASE      bármilyen HOSSZÚ véletlen szöveg (20+ karakter) – ezzel titkosítjuk az aláíró kulcsot
#   GOOGLE_SERVICES_JSON     a Firebase-ből letöltött google-services.json TELJES tartalma
#
# Fix aláíró kulcs: a workflow egyszer legenerálja (Run workflow → create_keystore),
# TITKOSÍTVA elmenti a repóba (debug.keystore.enc), és minden build ezt használja.
# (Publikus repónál is biztonságos: jelszó nélkül a fájl használhatatlan.)
#
# Miért kell a fix kulcs: a GitHub runner minden buildnél ÚJ debug kulcsot generál →
# minden APK más SHA-1-gyel készül, így a Google belépés nem működhet, és az APK
# nem frissíthető a telepített felett. Fix kulccsal mindkettő megoldódik.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_keystore:
        description: 'Egyszeri: fix aláíró kulcs generálása (APK-t nem épít)'
        type: boolean
        default: false

jobs:
  keystore:
    if: ${{ github.event.inputs.create_keystore == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate + encrypt keystore
        env:
          PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -f debug.keystore.enc ]; then
            echo "::error::Már van debug.keystore.enc a repóban – nem írom felül (új kulccsal a telepített APK nem frissíthető, és a Firebase-ben lévő SHA-1 érvénytelen lenne). Ha tényleg újat akarsz, előbb töröld a fájlt a repóból."
            exit 1
          fi
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::Hiányzik a KEYSTORE_PASSPHRASE repo secret"
            exit 1
          fi
          keytool -genkeypair -keystore debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "### Az új kulcs ujjlenyomatai → Firebase → Project settings → Android app (com.chronos.app) → Add fingerprint (mindkettőt)"
            keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in debug.keystore -out debug.keystore.enc -pass env:PASSPHRASE
          rm -f debug.keystore

      - name: Commit encrypted keystore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug.keystore.enc
          git commit -m "Add encrypted signing keystore [skip ci]"
          git push

  build:
    if: ${{ github.event.inputs.create_keystore != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Chronos source
        run: unzip -o chronos-capacitor.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & sync Capacitor
        working-directory: chronos
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Check native Google sign-in plugin is included
        working-directory: chronos
        run: |
          PJ="android/app/src/main/assets/capacitor.plugins.json"
          cat "$PJ"
          grep -q FirebaseAuthentication "$PJ" || { echo "::error::A FirebaseAuthentication plugin nem került be (a chronos-capacitor.zip package.json-jában benne van a @capacitor-firebase/authentication?)"; exit 1; }

      - name: Patch build.gradle – add biometric, core & activity dependencies
        working-directory: chronos
        run: |
          GRADLE="android/app/build.gradle"
          sed -i 's|dependencies {|dependencies {\n    implementation "androidx.biometric:biometric:1.1.0"\n    implementation "androidx.core:core:1.10.0"\n    implementation "androidx.activity:activity:1.8.0"\n    implementation "com.google.android.gms:play-services-auth:21.2.0"|' "$GRADLE"

      - name: Patch AndroidManifest – permissions
        working-directory: chronos
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>|' "$MANIFEST"

      - name: Add FileProvider (needed for AndroidBridge.shareFile)
        working-directory: chronos
        run: |
          RES_DIR="android/app/src/main/res"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          # 1. file_paths.xml létrehozása
          mkdir -p "${RES_DIR}/xml"
          cp android-res/xml/file_paths.xml "${RES_DIR}/xml/file_paths.xml"

          # 2. <provider> beillesztése a záró </application> elé
          PROVIDER='    <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" /></provider>'
          sed -i "s|</application>|${PROVIDER}\n</application>|" "$MANIFEST"

      - name: Inject custom MainActivity (biometric bridge)
        working-directory: chronos
        run: |
          DEST="android/app/src/main/java/com/chronos/app/MainActivity.java"
          cp MainActivity.java "$DEST"

      - name: Set version in bootloader
        working-directory: chronos
        run: |
          # A verziót a chronos_version.txt fájlból olvassa (repóban kell legyen)
          # Ha nincs ilyen fájl, az aktuális git tag-et használja, különben 1.0.0
          if [ -f "../chronos_version.txt" ]; then
            VERSION=$(cat ../chronos_version.txt | tr -d '[:space:]')
          elif git describe --tags --exact-match 2>/dev/null; then
            VERSION=$(git describe --tags --exact-match | tr -d 'v')
          else
            VERSION="1.0.0"
          fi
          echo "Verzió: $VERSION"
          sed -i "s|const CURRENT_VERSION = \".*\"|const CURRENT_VERSION = \"$VERSION\"|" www/bootloader.html

      - name: Patch icons & adaptive icon
        working-directory: chronos
        run: |
          RES_DIR="android/app/src/main/res"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "icons/mipmap-${density}/ic_launcher.png"            "${RES_DIR}/mipmap-${density}/ic_launcher.png"
            cp "icons/mipmap-${density}/ic_launcher_round.png"      "${RES_DIR}/mipmap-${density}/ic_launcher_round.png"
            cp "icons/mipmap-${density}/ic_launcher_foreground.png" "${RES_DIR}/mipmap-${density}/ic_launcher_foreground.png"
          done

          mkdir -p "${RES_DIR}/values"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#0a0e1a</color></resources>\n' \
            > "${RES_DIR}/values/ic_launcher_background.xml"

          mkdir -p "${RES_DIR}/mipmap-anydpi-v26"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' \
            > "${RES_DIR}/mipmap-anydpi-v26/ic_launcher.xml"
          cp "${RES_DIR}/mipmap-anydpi-v26/ic_launcher.xml" \
             "${RES_DIR}/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Add google-services.json (Firebase / Google sign-in)
        working-directory: chronos
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "::error::Hiányzik a GOOGLE_SERVICES_JSON repo secret (Firebase → Project settings → google-services.json tartalma)"
            exit 1
          fi
          printf '%s' "$GSJ" > android/app/google-services.json
          python3 - <<'PY'
          import json, pathlib, re, sys
          d = json.load(open('android/app/google-services.json'))
          pk = [c['client_info']['android_client_info']['package_name'] for c in d.get('client', [])]
          if 'com.chronos.app' not in pk:
              sys.exit("::error::A google-services.json-ban nincs com.chronos.app Android app (van: %s)" % pk)
          types = [o.get('client_type') for c in d['client'] for o in c.get('oauth_client', [])]
          if 3 not in types:
              sys.exit("::error::A google-services.json-ban nincs web OAuth kliens (client_type 3). "
                       "Firebase: Google provider Enabled + SHA-1 hozzáadva, utána töltsd le újra a fájlt.")
          print("google-services.json rendben:", pk, types)

          # a google-services Gradle plugin legyen bekötve (a Capacitor sablonban általában megvan)
          rg = pathlib.Path('android/build.gradle')
          r = rg.read_text(encoding='utf-8')
          if 'com.google.gms:google-services' not in r:
              r = re.sub(r"(classpath ['\"]com\.android\.tools\.build:gradle:[^'\"]+['\"]\n)",
                         lambda m: m.group(1) + "        classpath 'com.google.gms:google-services:4.4.2'\n",
                         r, count=1)
              rg.write_text(r, encoding='utf-8')
          ag = pathlib.Path('android/app/build.gradle')
          a = ag.read_text(encoding='utf-8')
          if 'com.google.gms.google-services' not in a:
              ag.write_text(a + "\napply plugin: 'com.google.gms.google-services'\n", encoding='utf-8')
          PY

      - name: Use fixed signing key
        env:
          PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -f debug.keystore.enc ] && [ -n "$PASSPHRASE" ]; then
            mkdir -p ~/.android
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in debug.keystore.enc -out ~/.android/debug.keystore -pass env:PASSPHRASE
          else
            echo "::warning::Nincs fix kulcs (debug.keystore.enc vagy KEYSTORE_PASSPHRASE hiányzik) → ez a build véletlen kulccsal íródik alá: a Google belépés nem fog működni, és az APK nem frissíthető a telepített felett. Futtasd egyszer a workflow-t create_keystore = igen beállítással."
          fi

      - name: Build APK
        working-directory: chronos/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Show signing fingerprints
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          {
            echo "### APK aláíró ujjlenyomatai (ezeknek szerepelnie kell a Firebase Android appban)"
            "$BT/apksigner" verify --print-certs chronos/android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-1|SHA-256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronos-apk
          path: chronos/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
